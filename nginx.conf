# Redireciona HTTP → HTTPS
server {
    listen 80;
    server_name backend.belko.com.br;
    return 301 https://$host$request_uri;
}

# Proxy HTTPS → Fastify
server {
    listen 443 ssl http2;
    server_name backend.belko.com.br;

    # Monte seu diretório de certificados do host aqui:
    ssl_certificate     /etc/letsencrypt/live/backend.belko.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/backend.belko.com.br/privkey.pem;

    # Todas as rotas vão para o Fastify na porta 3000
    location / {
        proxy_pass         http://server:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Preflight CORS (se ainda for necessário)
        if ($request_method = OPTIONS) {
            add_header 'Access-Control-Allow-Origin'  '$http_origin' always;
            add_header 'Access-Control-Allow-Credentials' 'true'   always;
            add_header 'Access-Control-Allow-Methods'     'GET,POST,PUT,DELETE,OPTIONS' always;
            add_header 'Access-Control-Allow-Headers'     'Authorization,Content-Type'         always;
            add_header 'Content-Length' 0;
            return 204;
        }
    }
}
